[project]
name = "model-registry-board"
version = "2.0.0"
description = "Model cards with versioned artifacts and staging/production promotion gates — a lightweight registry for ML teams shipping iteratively."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
